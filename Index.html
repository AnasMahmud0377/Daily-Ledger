<nav class="bar" id="bar"></nav><div id="sc" onclick="unfan()"></div><div id="fan"></div><button class="fb" aria-label="Back" onclick="goBack()"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>

<div class="toast" id="toast"></div>

/* Note Count (not in balance) */
const DEN=[1000,500,200,100,50],NCOL={1000:['#613080','#a663d1'],500:['#558030','#95d163'],200:['#806830','#d1b063'],100:['#306080','#63a5d1'],50:['#804430','#d17e63']};
const nq=d=>Math.max(0,Math.floor(+((S.notes||{})[d])||0)),ntot=()=>DEN.reduce((a,d)=>a+nq(d)*d,0),ncnt=()=>DEN.reduce((a,d)=>a+nq(d),0);
const tiles=()=>{const a=Object.keys(T).map((t,n)=>`<button class="tile${t==='sells'?' wide':''}" style="--c:var(--${T[t].c});--k:${n+1}" onclick="openCat('${t}')"><span class="ic">${IC[T[t].i]}</span><span class="tt"><span class="tn">${T[t].l}</span><span class="ts">${t==='sells'?'Not in balance':''}</span></span><span class="ta">${money(sum(t))}</span></button>`);a.splice(a.length-1,0,`<button class="tile" style="--c:var(--n);--k:6" onclick="openCat('notes')"><span class="ic">${IC.cash}</span><span class="tt"><span class="tn">Note Count</span><span class="ts">${ncnt().toLocaleString('en-IN')} notes</span></span><span class="ta">${money(ntot())}</span></button>`);return a.join('')};
function ncat(){
$('cat').style.setProperty('--c','var(--n)');
$('cat').innerHTML=`<h1>Note Count</h1><div class="sub">Not included in balance</div><div class="ntot"><div><small>Total amount</small><b id="ntm">${money(ntot())}</b></div><div style="text-align:right"><small>Total notes</small><b id="ntc" style="font-size:20px">${ncnt().toLocaleString('en-IN')}</b></div></div>${DEN.map(d=>`<div class="nt" style="--a:${NCOL[d][0]};--b:${NCOL[d][1]}"><img class="nimg" alt="${d} taka note" src="${NIMG[d]}"><div class="nr"><div class="ns"><button onclick="nadj(${d},-1)">−</button><input id="nq${d}" inputmode="numeric" placeholder="0" value="${nq(d)||''}" oninput="nset(${d},this)"><button onclick="nadj(${d},1)">+</button></div><div class="na" id="na${d}">${money(nq(d)*d)}</div></div></div>`).join('')}<button class="txt-red" onclick="nclear()">Clear all counts</button>`}
function nupd(){DEN.forEach(d=>{const e=$('na'+d);if(e)e.textContent=money(nq(d)*d)});if($('ntc'))$('ntc').textContent=ncnt().toLocaleString('en-IN');if($('ntm'))$('ntm').textContent=money(ntot())}
function nset(d,el){const v=el.value.replace(/\D/g,'').slice(0,9);el.value=v;S.notes=S.notes||{};S.notes[d]=+v||0;nupd();save()}
function nadj(d,k){S.notes=S.notes||{};S.notes[d]=Math.max(0,nq(d)+k);$('nq'+d).value=S.notes[d]||'';nupd();save()}
function nclear(){const o={...(S.notes||{})},day=S;if(!ncnt())return;day.notes={};save();ncat();undoT('Counts cleared',()=>{if(day!==S)return toast('Undo no longer available');day.notes=o;save();ncat()})}
const tick=()=>{$('clk').textContent=new Date().toLocaleTimeString('en-GB')};
$('bar').innerHTML=`<button class="bi upd" id="bu" onclick="upd()">${IC.sync}<span>Update</span></button><button class="pl" id="bp" onclick="plus()" aria-label="New entry">${IC.plus}</button><button class="bi" id="bm" onclick="fan('m')">${IC.dots}<span>Menu</span></button>`;
$('cat').addEventListener('click',e=>{const r=e.target.closest('.row');if(r)openForm(cur,r.dataset.id)});
const MK='rainbow_daily_ledger_methods_v1',DEF=['Cash','Bank','Cheque'];let MT=[...DEF];
const chips=(k,cv)=>{const L2=!cv||MT.includes(cv)?MT:[...MT,cv];return L2.map(x=>`<button class="${x===cv?'on':''}" data-v="${esc(x)}" onclick="seg(this)">${esc(x)}${DEF.includes(x)||!MT.includes(x)?'':`<b class="rm" onclick="event.stopPropagation();rmM('${k}',${MT.indexOf(x)})">×</b>`}</button>`).join('')+`<span class="addm"><input id="nm_${k}" placeholder="Add method" maxlength="20"><button onclick="addM('${k}')">＋</button></span>`};
const selV=k=>(($('f_'+k).querySelector('.on')||{}).dataset||{}).v||'';
const addM=k=>{const v=$('nm_'+k).value.trim();if(!v)return;let m=MT.find(x=>x.toLowerCase()===v.toLowerCase());if(!m){m=v;MT.push(v);save()}$('f_'+k).innerHTML=chips(k,m)};
const rmM=(k,i)=>{const c=selV(k),r=MT[i];MT.splice(i,1);save();$('f_'+k).innerHTML=chips(k,c===r?MT[0]:c)};
const goBack=()=>{if($('ov').classList.contains('on'))shut();else if(fo)unfan();else if(cur)back()};
let fo=null;
function unfan(){fo=null;$('sc').classList.remove('on');$('fan').classList.remove('on');$('bp').classList.remove('x');$('bm').innerHTML=IC.dots+'<span>Menu</span>'}
function fan(w){
if(fo===w)return unfan();
unfan();fo=w;
const it=w==='n'?Object.keys(T).map(t=>[T[t].i,T[t].l,`openForm('${t}')`,T[t].c]):MI.map(([i,l,f])=>[i,l,f,'ac']),b=$(w==='n'?'bp':'bm'),f=$('fan');
f.style.right=(innerWidth-b.getBoundingClientRect().right)+'px';
f.innerHTML=it.map(([i,l,fn,c],k)=>`<button class="pill" style="--i:${it.length-1-k};--c:var(--${c})" onclick="unfan();${fn}"><span class="pi">${IC[i]}</span>${l}</button>`).join('');
f.classList.add('on');$('sc').classList.add('on');
if(w==='n')b.classList.add('x');else b.innerHTML=IC.x+'<span>Close</span>'}
const sh=$('sh'),ov=$('ov');let x0=0,y0=0,dy=0,dr=false;
sh.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;dy=0;dr=false},{passive:true});
sh.addEventListener('touchmove',e=>{const d=e.touches[0].clientY-y0;if(!dr&&d>6&&d>Math.abs(e.touches[0].clientX-x0)&&sh.scrollTop<=0)dr=true;if(dr){e.preventDefault();dy=Math.max(0,d);sh.style.transition='none';sh.style.transform=`translateY(${dy}px)`}},{passive:false});
sh.addEventListener('touchend',()=>{if(!dr)return;dr=false;sh.style.transition='';if(dy>110){sh.style.transform='translateY(110%)';shut();setTimeout(()=>sh.style.transform='',650)}else sh.style.transform=''});
ov.addEventListener('touchmove',e=>{if(e.target===ov)e.preventDefault()},{passive:false});
const posFb=()=>document.documentElement.style.setProperty('--bw',$('bar').offsetWidth+'px');
addEventListener('resize',posFb);
load();render();tick();setInterval(tick,1000);posFb();setTimeout(posFb,300);anim();
</script></body></html>
